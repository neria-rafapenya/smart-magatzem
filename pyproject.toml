[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-magatzem"
version = "0.1.0"
description = "Primer vertical local para gestionar inventario de Smart Magatzem"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0,<7.0",
    "Pillow>=10.0,<12.0",
]

[tool.setuptools]
packages = ["backend", "ERP"]
